
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a1120">
<title>MOVA - Đăng ký tài xế</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  color-scheme: dark;
  --bg:#0a1120;
  --card:#121d31;
  --line:#25344d;
  --text:#f2f5ee;
  --muted:#9aa8bf;
  --lime:#c7f36b;
  --red:#ff8f86;
  --green:#7ee08a;
}
* {box-sizing:border-box}
body {
  margin:0;
  padding:20px;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
  line-height:1.6;
}
.container {max-width:520px;margin:auto}
.card {
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  padding:22px;
  margin-top:20px;
}
h1 {font-size:25px;margin:0}
.muted {color:var(--muted)}
label {
  display:block;
  margin-top:15px;
  font-weight:bold;
}
input,select {
  width:100%;
  padding:13px;
  margin-top:5px;
  border-radius:10px;
  border:1px solid var(--line);
  background:var(--bg);
  color:var(--text);
  font-size:16px;
}
button {
  width:100%;
  padding:14px;
  margin-top:20px;
  border:0;
  border-radius:10px;
  background:var(--lime);
  color:#0a1120;
  font-size:16px;
  font-weight:bold;
}
button:disabled {opacity:.5}
.tabs {display:flex;gap:10px}
.tabs button {
  background:var(--bg);
  color:var(--text);
  border:1px solid var(--line);
}
.tabs button.active {
  background:var(--lime);
  color:#0a1120;
}
.check {display:flex;gap:10px;align-items:flex-start}
.check input {width:20px;margin-top:18px}
.message {overflow-wrap:anywhere;font-weight:bold}
.error {color:var(--red)}
.success {color:var(--green)}
.hidden {display:none!important}
a {color:var(--lime)}
</style>
</head>
<body>
<div class="container">

<h1>MOVA</h1>
<p class="muted">Move Easy, Move Smart.</p>

<section id="authView" class="card">
<h2>Trở thành tài xế MOVA</h2>
<p class="muted">Đăng ký xe máy hoặc xe tải nhỏ tại Việt Nam.</p>

<div class="tabs">
<button id="showSignup" class="active" type="button">Đăng ký</button>
<button id="showLogin" type="button">Đăng nhập</button>
</div>

<form id="signupForm">
<label>Họ và tên *</label>
<input id="name" required maxlength="100" placeholder="Nguyễn Văn A">

<label>Số điện thoại *</label>
<input id="phone" required type="tel" placeholder="0901234567">

<label>Loại phương tiện *</label>
<select id="vehicle" required>
<option value="">-- Chọn phương tiện --</option>
<option>Xe máy</option>
<option>Xe tải 500kg</option>
<option>Xe tải 1 tấn</option>
<option>Xe tải 1,5 tấn</option>
<option>Xe tải 2 tấn</option>
<option>Xe tải 2,5 tấn</option>
</select>

<label>Email *</label>
<input id="email" type="email" required placeholder="email@example.com">

<label>Mật khẩu * (ít nhất 8 ký tự)</label>
<input id="password" type="password" required minlength="8">

<label class="check">
<input id="consent" type="checkbox" required>
<span>Tôi đồng ý để MOVA liên hệ với tôi qua số điện thoại đã đăng ký.</span>
</label>

<button id="signupBtn" type="submit">Gửi đăng ký</button>
</form>

<form id="loginForm" class="hidden">
<label>Email</label>
<input id="loginEmail" type="email" required>
<label>Mật khẩu</label>
<input id="loginPassword" type="password" required>
<button id="loginBtn" type="submit">Đăng nhập</button>
</form>

<p id="authMessage" class="message"></p>
</section>

<section id="statusView" class="card hidden">
<h2 id="statusTitle">Hồ sơ tài xế</h2>
<p id="statusText" class="muted"></p>
<p>Họ tên：<span id="statusName"></span></p>
<p>Điện thoại：<span id="statusPhone"></span></p>
<p>Phương tiện：<span id="statusVehicle"></span></p>
<button id="refreshBtn" type="button">Kiểm tra trạng thái</button>
<button id="logoutBtn" type="button">Đăng xuất</button>
<p id="statusMessage" class="message"></p>
</section>

<p style="text-align:center;margin-top:25px">
<a href="./">← Về trang chủ MOVA</a>
</p>

</div>

<script>
const SUPABASE_URL =
"https://ujggieewnhzekuphtbmj.supabase.co";

const SUPABASE_KEY =
"sb_publishable_ANjWXcCTlAlJUZ5YqgXvQ_SkhErKsf";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const $ = id => document.getElementById(id);

function message(id,text,type) {
  $(id).textContent = text || "";
  $(id).className = "message " + (type || "");
}

function showView(name) {
  $("authView").classList.toggle("hidden",name !== "auth");
  $("statusView").classList.toggle("hidden",name !== "status");
}

function showMode(mode) {
  const signup = mode === "signup";
  $("signupForm").classList.toggle("hidden",!signup);
  $("loginForm").classList.toggle("hidden",signup);
  $("showSignup").classList.toggle("active",signup);
  $("showLogin").classList.toggle("active",!signup);
  message("authMessage","");
}

$("showSignup").onclick = () => showMode("signup");
$("showLogin").onclick = () => showMode("login");

function normalizePhone(value) {
  let p = value.replace(/[\s.-]/g,"");
  if (/^\+?84\d{9,10}$/.test(p)) {
    p = "0" + p.replace(/^\+?84/,"");
  }
  return p;
}

function validPhone(phone) {
  return /^0\d{9,10}$/.test(phone);
}

async function loadProfile(session) {
  if (!session) {
    showView("auth");
    return;
  }

  const result = await db
    .from("driver_profiles")
    .select("full_name,phone,vehicle_type,is_active")
    .eq("user_id",session.user.id)
    .maybeSingle();

  if (result.error) {
    showView("auth");
    message(
      "authMessage",
      "Không thể tải hồ sơ: " + result.error.message,
      "error"
    );
    return;
  }

  if (!result.data) {
    showView("auth");
    message(
      "authMessage",
      "Tài khoản chưa có hồ sơ tài xế. Vui lòng liên hệ MOVA.",
      "error"
    );
    return;
  }

  const d = result.data;
  $("statusName").textContent = d.full_name || "-";
  $("statusPhone").textContent = d.phone || "-";
  $("statusVehicle").textContent = d.vehicle_type || "-";

  if (d.is_active) {
    $("statusTitle").textContent = "Hồ sơ đã được duyệt";
    $("statusText").textContent =
      "Bạn đã được MOVA chấp thuận làm tài xế.";
  } else {
    $("statusTitle").textContent = "Hồ sơ đang chờ duyệt";
    $("statusText").textContent =
      "MOVA đang xem xét hồ sơ. Chúng tôi sẽ liên hệ với bạn.";
  }

  showView("status");
}

$("signupForm").addEventListener("submit",async e => {
  e.preventDefault();

  const name = $("name").value.trim();
  const phone = normalizePhone($("phone").value);
  const vehicle = $("vehicle").value;
  const email = $("email").value.trim();
  const password = $("password").value;

  if (!name || !vehicle || !email || password.length < 8) {
    message("authMessage","Vui lòng kiểm tra thông tin.","error");
    return;
  }

  if (!validPhone(phone)) {
    message("authMessage","Số điện thoại chưa đúng.","error");
    return;
  }

  if (!$("consent").checked) {
    message("authMessage","Vui lòng đồng ý để MOVA liên hệ.","error");
    return;
  }

  $("signupBtn").disabled = true;
  message("authMessage","Đang tạo tài khoản...");

  try {
    const result = await db.auth.signUp({
      email,
      password,
      options:{
        data:{
          full_name:name,
          phone,
          vehicle_type:vehicle
        },
        emailRedirectTo:
          location.origin + location.pathname
      }
    });

    if (result.error) throw result.error;

    $("signupForm").reset();

    if (result.data.session) {
      await loadProfile(result.data.session);
    } else {
      showMode("login");
      message(
        "authMessage",
        "Đăng ký thành công. Hãy mở email và bấm liên kết xác nhận, sau đó đăng nhập.",
        "success"
      );
    }
  } catch(error) {
    message("authMessage",error.message,"error");
  } finally {
    $("signupBtn").disabled = false;
  }
});

$("loginForm").addEventListener("submit",async e => {
  e.preventDefault();

  $("loginBtn").disabled = true;
  message("authMessage","Đang đăng nhập...");

  try {
    const result = await db.auth.signInWithPassword({
      email:$("loginEmail").value.trim(),
      password:$("loginPassword").value
    });

    if (result.error) throw result.error;

    $("loginForm").reset();
    await loadProfile(result.data.session);
  } catch(error) {
    message("authMessage",error.message,"error");
  } finally {
    $("loginBtn").disabled = false;
  }
});

$("refreshBtn").onclick = async () => {
  const result = await db.auth.getSession();
  await loadProfile(result.data.session);
};

$("logoutBtn").onclick = async () => {
  await db.auth.signOut();
  showView("auth");
  showMode("login");
  message("authMessage","Đã đăng xuất.","success");
};

(async function init() {
  const result = await db.auth.getSession();
  await loadProfile(result.data.session);
})();
</script>
</body>
</html>
