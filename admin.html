<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1120">
<meta name="robots" content="noindex, nofollow">
<title>MOVA Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{color-scheme:dark;--bg:#0a1120;--card:#121d31;--line:#25344d;--text:#f2f5ee;--muted:#9aa8bf;--lime:#c7f36b;--red:#ff8f86;--green:#7ee08a;--amber:#ffd166;--blue:#7cc4ff;--font:"Be Vietnam Pro","Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;padding:20px;padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--bg);color:var(--text);font-family:var(--font);line-height:1.5}
.container{max-width:1100px;margin:auto}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:22px}
.logo{font-size:24px;font-weight:800;letter-spacing:.04em}.logo span{color:var(--lime)}
.who{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
h2{margin:0 0 6px;font-size:22px}.muted{color:var(--muted)}
.hidden,[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--lime);outline-offset:2px;border-radius:8px}
input,select{width:100%;padding:13px;margin:6px 0;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--text);font:inherit;font-weight:700;font-size:14px;cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--muted)}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--lime);color:#0a1120;border-color:var(--lime)}
.btn-danger{color:var(--red);border-color:#5a2d2a}
.btn-block{width:100%;margin-top:8px;padding:13px;font-size:15px}
.message{margin-top:12px;overflow-wrap:anywhere;font-weight:500}
.error{color:var(--red)}.success{color:var(--green)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}
.stat{background:var(--bg);padding:14px 16px;border-radius:12px;border:1px solid var(--line)}
.stat b{display:block;font-size:26px;line-height:1.2}.stat small{color:var(--muted)}.stat.alert b{color:var(--amber)}
.tools{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center}.tools input{margin:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 0 4px;-webkit-overflow-scrolling:touch}
.chip{flex:none;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--text);font:inherit;font-size:14px;cursor:pointer}
.chip b{margin-left:4px;color:var(--muted)}
.chip.active{background:var(--lime);color:#0a1120;border-color:var(--lime);font-weight:700}.chip.active b{color:#0a1120}
.order{--c:var(--line);margin-top:12px;padding:16px;background:var(--bg);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:14px}
.order.s-pending{--c:var(--amber)}.order.s-assigned{--c:var(--blue)}.order.s-progress{--c:#b69cff}.order.s-done{--c:var(--green)}.order.s-cancel{--c:var(--red);opacity:.8}
.order-top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.badge{padding:4px 11px;border-radius:999px;font-size:12px;font-weight:700;background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--c)}
.time{font-size:13px;color:var(--muted)}
.info{display:grid;grid-template-columns:1fr 1fr;gap:10px 20px;margin:12px 0}
.info div{min-width:0;overflow-wrap:anywhere}.info small{display:block;color:var(--muted);font-size:12px}
.info a{color:var(--lime);text-decoration:none;font-weight:600}.info .full{grid-column:1/-1}
.gps-coords{font-size:12px;color:var(--muted);margin-top:4px}
.maplinks{display:flex;flex-wrap:wrap;gap:14px;margin-top:6px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.driver-box{margin:14px 0;padding:14px;border:1px solid var(--line);border-radius:12px;background:#101a2c}
.driver-box strong{display:block;margin-bottom:5px}.driver-box .muted{font-size:13px}
.driver-controls{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin-top:8px}
.driver-controls select,.driver-controls input{margin:0}
.fee-note{font-size:12px;color:var(--muted);margin-top:8px}
.more{margin-top:14px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:#1d2c47;border:1px solid var(--line);color:var(--text);padding:12px 18px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%)}#toast.ok{border-color:var(--green)}#toast.bad{border-color:var(--red)}
@media(max-width:700px){
body{padding:12px;padding-top:calc(12px + env(safe-area-inset-top,0px))}
.stats{grid-template-columns:1fr 1fr}.tools{grid-template-columns:1fr 1fr}.tools input{grid-column:1/-1}
.info{grid-template-columns:1fr}.driver-controls{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<div class="container">
<header>
  <div class="logo">MO<span>VA</span> ADMIN</div>
  <div class="who hidden" id="whoBox"><span id="whoEmail"></span><button id="logoutButton" class="btn" type="button">Đăng xuất</button></div>
</header>

<section id="loginCard" class="card" style="max-width:460px;margin-inline:auto">
  <h2>Đăng nhập quản trị</h2>
  <p class="muted">Chỉ tài khoản quản trị MOVA được phép truy cập.</p>
  <form id="loginForm">
    <input id="email" type="email" placeholder="Email quản trị" required autocomplete="username">
    <input id="password" type="password" placeholder="Mật khẩu" required autocomplete="current-password">
    <button id="loginButton" class="btn btn-primary btn-block" type="submit">Đăng nhập</button>
  </form>
  <p id="loginMessage" class="message" role="status" aria-live="polite"></p>
</section>

<section id="dashboard" class="hidden">
  <div class="card">
    <h2>Quản lý đơn hàng</h2>
    <p class="muted" id="liveStatus">Đang kết nối...</p>
    <div class="stats">
      <div class="stat alert"><b id="pendingCount">0</b><small>Chờ xử lý</small></div>
      <div class="stat"><b id="activeCount">0</b><small>Đang thực hiện</small></div>
      <div class="stat"><b id="todayCount">0</b><small>Đơn hôm nay</small></div>
      <div class="stat"><b id="totalCount">0</b><small>Tổng đơn</small></div>
    </div>
  </div>
  <div class="card"><h2>Danh sách tài xế</h2><p class="muted" id="driverStatus">Đang tải tài xế...</p></div>
  <div class="card">
    <div class="tools">
      <input id="searchInput" type="search" placeholder="Tìm số điện thoại, địa chỉ, dịch vụ, ID..." aria-label="Tìm đơn hàng">
      <button id="exportButton" class="btn" type="button">Xuất CSV</button>
      <button id="refreshButton" class="btn btn-primary" type="button">Làm mới</button>
    </div>
    <div class="chips" id="chips" aria-label="Lọc theo trạng thái"></div>
    <p id="orderMessage" class="message muted" role="status" aria-live="polite"></p>
    <div id="ordersList"></div>
    <button id="moreButton" class="btn btn-block more hidden" type="button"></button>
  </div>
</section>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
var SUPABASE_URL="https://ujggieewnhzekuphtbmj.supabase.co";
var SUPABASE_KEY="sb_publishable_ANjWXcCTlAlJ0UZ5YqgXvQ_SkhErKsf";
var PAGE_SIZE=30,POLL_MS=60000;
var db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

var STATUS={
  pending:{label:"Chờ xử lý",cls:"s-pending"},
  assigned:{label:"Đã phân tài xế",cls:"s-assigned"},
  in_progress:{label:"Đang vận chuyển",cls:"s-progress"},
  completed:{label:"Đã hoàn thành",cls:"s-done"},
  cancelled:{label:"Đã hủy",cls:"s-cancel"}
};
var NEXT={pending:["assigned","cancelled"],assigned:["in_progress","cancelled"],in_progress:["completed","cancelled"],completed:[],cancelled:["pending"]};
var ACTION={assigned:"Phân tài xế",in_progress:"Bắt đầu vận chuyển",completed:"Hoàn thành",cancelled:"Hủy đơn",pending:"Mở lại đơn"};

var $=function(id){return document.getElementById(id);};
var allOrders=[],allDrivers=[],filterStatus="",visibleLimit=PAGE_SIZE;
var channel=null,pollTimer=null,reloadTimer=null,searchTimer=null,firstLoadDone=false,loadSeq=0,busy={};

function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function setMsg(el,text,type){el.textContent=text;el.className="message "+(type||"");}
var toastTimer;
function toast(text,type){var t=$("toast");t.textContent=text;t.className="show "+(type||"");clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.className="";},3200);}

/* 提示音：复用同一个 AudioContext，首次点击后解锁 */
var audioCtx=null;
function unlockAudio(){try{if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==="suspended")audioCtx.resume();}catch(e){}}
document.addEventListener("pointerdown",unlockAudio,{once:true});
function beep(){
  try{
    if(!audioCtx)return;
    var o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.connect(g);g.connect(audioCtx.destination);o.frequency.value=880;g.gain.value=0.08;
    o.start();o.stop(audioCtx.currentTime+0.18);
  }catch(e){}
}

function fmtDate(v){return v?new Date(v).toLocaleString("vi-VN"):"-";}
function fmtVnd(v){return Number(v).toLocaleString("vi-VN")+" đ";}
function ago(v){
  if(!v)return "";
  var m=Math.floor((Date.now()-new Date(v).getTime())/60000);
  if(m<1)return "vừa xong";if(m<60)return m+" phút trước";
  var h=Math.floor(m/60);if(h<24)return h+" giờ trước";
  return Math.floor(h/24)+" ngày trước";
}
function isToday(v){return v&&new Date(v).toDateString()===new Date().toDateString();}
function phoneHref(p){return "tel:"+String(p||"").replace(/[^\d+]/g,"");}
function mapHref(a){return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(a||"");}
function hasGps(o){return o.pickup_latitude!=null&&o.pickup_longitude!=null&&Number.isFinite(Number(o.pickup_latitude))&&Number.isFinite(Number(o.pickup_longitude));}
function pickupMapHref(o){return hasGps(o)?"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(o.pickup_latitude+","+o.pickup_longitude):mapHref(o.pickup_address);}
function dirHref(o){return hasGps(o)?"https://www.google.com/maps/dir/?api=1&destination="+encodeURIComponent(o.pickup_latitude+","+o.pickup_longitude):mapHref(o.pickup_address);}
function viError(msg){
  if(/invalid login/i.test(msg))return "Email hoặc mật khẩu không đúng.";
  if(/network|fetch/i.test(msg))return "Lỗi mạng. Vui lòng thử lại.";
  return msg||"Đăng nhập thất bại.";
}

/* 防重复点击：同一个操作未完成时忽略再次点击 */
async function once(key,fn){
  if(busy[key])return;
  busy[key]=true;
  try{await fn();}finally{delete busy[key];}
}

/* 管理员验证 */
async function verifyAdmin(user){
  var r=await db.from("admin_users").select("user_id").eq("user_id",user.id).maybeSingle();
  if(r.error)throw new Error("Không thể xác minh quyền quản trị: "+r.error.message);
  if(!r.data)throw new Error("Tài khoản này không có quyền quản trị MOVA.");
}

/* 读取全部司机（含已停用，避免已分配的司机显示成“未分配”） */
async function loadDrivers(){
  var r=await db.from("driver_profiles").select("user_id,full_name,phone,vehicle_type,is_active").order("created_at",{ascending:false});
  if(r.error){$("driverStatus").textContent="Không tải được tài xế: "+r.error.message;allDrivers=[];return;}
  allDrivers=r.data||[];
  var n=activeDrivers().length;
  $("driverStatus").textContent="Có "+n+" tài xế đang hoạt động"+(n===0?" - chưa thể phân đơn.":".");
}
function activeDrivers(){return allDrivers.filter(function(d){return d.is_active===true;});}

async function openDashboard(user){
  await verifyAdmin(user);
  $("loginCard").classList.add("hidden");$("dashboard").classList.remove("hidden");$("whoBox").classList.remove("hidden");
  $("whoEmail").textContent=user.email||"";
  await loadDrivers();await loadOrders();startLive();
}
function showLogin(msg,type){
  stopLive();allOrders=[];allDrivers=[];firstLoadDone=false;
  $("dashboard").classList.add("hidden");$("whoBox").classList.add("hidden");$("loginCard").classList.remove("hidden");
  $("password").value="";document.title="MOVA Admin";setMsg($("loginMessage"),msg||"",type);
}

$("loginForm").addEventListener("submit",async function(e){
  e.preventDefault();
  var btn=$("loginButton");btn.disabled=true;btn.textContent="Đang đăng nhập...";setMsg($("loginMessage"),"","");
  try{
    var r=await db.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});
    if(r.error)throw r.error;
    await openDashboard(r.data.user);
  }catch(err){await db.auth.signOut();showLogin(viError(err.message),"error");}
  finally{btn.disabled=false;btn.textContent="Đăng nhập";}
});
$("logoutButton").addEventListener("click",async function(){await db.auth.signOut();showLogin("Đã đăng xuất.","success");});
db.auth.onAuthStateChange(function(event){
  if(event==="SIGNED_OUT"&&!$("dashboard").classList.contains("hidden"))showLogin("Phiên đăng nhập đã hết hạn. Vui lòng đăng nhập lại.","error");
});

/* 读取订单（用序号防止旧请求覆盖新数据） */
async function loadOrders(silent){
  var my=++loadSeq;
  if(!silent)setMsg($("orderMessage"),"Đang tải đơn hàng...","muted");
  var r=await db.from("orders").select("*").order("created_at",{ascending:false}).limit(500);
  if(my!==loadSeq)return;
  if(r.error){
    if(/jwt|token/i.test(r.error.message)){showLogin("Phiên đăng nhập đã hết hạn. Vui lòng đăng nhập lại.","error");return;}
    setMsg($("orderMessage"),"Không thể tải đơn hàng: "+r.error.message,"error");return;
  }
  var oldIds={};allOrders.forEach(function(o){oldIds[String(o.id)]=true;});
  var fresh=(r.data||[]).filter(function(o){return !oldIds[String(o.id)];});
  allOrders=r.data||[];
  if(firstLoadDone&&fresh.length){toast("Có "+fresh.length+" đơn mới!","ok");beep();}
  firstLoadDone=true;render();setMsg($("orderMessage"),"","");
}
function scheduleReload(){clearTimeout(reloadTimer);reloadTimer=setTimeout(function(){loadOrders(true);},400);}

/* 实时更新 */
function startLive(){
  stopLive();
  $("liveStatus").textContent="Tự động làm mới mỗi 60 giây.";
  try{
    channel=db.channel("orders-live")
      .on("postgres_changes",{event:"*",schema:"public",table:"orders"},scheduleReload)
      .subscribe(function(s){
        if(s==="SUBSCRIBED")$("liveStatus").textContent="Đang cập nhật trực tiếp.";
        else if(s==="CHANNEL_ERROR"||s==="TIMED_OUT"||s==="CLOSED")$("liveStatus").textContent="Mất kết nối trực tiếp, tự làm mới mỗi 60 giây.";
      });
  }catch(e){}
  pollTimer=setInterval(function(){loadOrders(true);loadDrivers();},POLL_MS);
}
function stopLive(){
  if(channel){db.removeChannel(channel);channel=null;}
  clearInterval(pollTimer);clearTimeout(reloadTimer);
}
/* 手机切回页面时立即刷新 */
document.addEventListener("visibilitychange",function(){
  if(!document.hidden&&!$("dashboard").classList.contains("hidden")){loadOrders(true);loadDrivers();}
});

/* 统计 */
function count(status){return allOrders.filter(function(o){return o.status===status;}).length;}
function updateStats(){
  var pending=count("pending");
  $("pendingCount").textContent=pending;
  $("activeCount").textContent=count("assigned")+count("in_progress");
  $("todayCount").textContent=allOrders.filter(function(o){return isToday(o.created_at);}).length;
  $("totalCount").textContent=allOrders.length;
  document.title=(pending?"("+pending+") ":"")+"MOVA Admin";
}
function renderChips(){
  var html='<button class="chip'+(filterStatus===""?" active":"")+'" data-filter="" aria-pressed="'+(filterStatus==="")+'">Tất cả<b>'+allOrders.length+"</b></button>";
  Object.keys(STATUS).forEach(function(k){
    html+='<button class="chip'+(filterStatus===k?" active":"")+'" data-filter="'+k+'" aria-pressed="'+(filterStatus===k)+'">'+STATUS[k].label+"<b>"+count(k)+"</b></button>";
  });
  $("chips").innerHTML=html;
}
function getDriver(id){
  if(!id)return null;
  return allDrivers.find(function(d){return String(d.user_id)===String(id);})||null;
}
function getFiltered(){
  var q=$("searchInput").value.trim().toLowerCase();
  var list=allOrders.filter(function(o){
    if(filterStatus&&o.status!==filterStatus)return false;
    if(!q)return true;
    var d=getDriver(o.assigned_driver_id);
    return [o.id,o.service_type,o.pickup_address,o.dropoff_address,o.customer_phone,o.note,d?d.full_name:"",d?d.phone:""].join(" ").toLowerCase().indexOf(q)!==-1;
  });
  /* 在“全部”里，把待处理的单排到最前面 */
  if(!filterStatus)list=list.slice().sort(function(a,b){return (a.status==="pending"?0:1)-(b.status==="pending"?0:1);});
  return list;
}

function driverOptions(o){
  var html='<option value="">-- Chọn tài xế --</option>';
  var list=activeDrivers().slice();
  var cur=getDriver(o.assigned_driver_id);
  if(cur&&!cur.is_active)list.unshift(cur);
  list.forEach(function(d){
    var sel=String(o.assigned_driver_id||"")===String(d.user_id);
    var label=(d.full_name||"Tài xế")+(d.phone?" - "+d.phone:"")+(d.is_active?"":" (đã ngừng)");
    html+='<option value="'+esc(d.user_id)+'"'+(sel?" selected":"")+'>'+esc(label)+'</option>';
  });
  return html;
}

function driverHTML(o){
  var driver=getDriver(o.assigned_driver_id);
  var locked=o.status==="completed"||o.status==="cancelled";
  var fare=(o.final_fare_vnd&&Number(o.final_fare_vnd)>0)?'<div class="muted">Giá cuối: <strong>'+esc(fmtVnd(o.final_fare_vnd))+'</strong></div>':"";
  var current=driver
    ?'<strong>Đã phân công: '+esc(driver.full_name)+'</strong><div class="muted">Điện thoại: '+esc(driver.phone||"-")+' · Xe: '+esc(driver.vehicle_type||"-")+'</div>'
    :'<strong>Chưa phân công tài xế</strong>';
  if(locked)return '<div class="driver-box">'+current+fare+'</div>';
  var id=esc(o.id);
  return '<div class="driver-box">'+current+fare+
    '<div class="driver-controls">'+
      '<select id="driver-'+id+'" aria-label="Chọn tài xế">'+driverOptions(o)+'</select>'+
      '<button type="button" class="btn btn-primary" data-act="assign" data-id="'+id+'">'+(driver?"Đổi tài xế":"Phân tài xế")+'</button>'+
    '</div>'+
    '<div class="driver-controls">'+
      '<input id="fare-'+id+'" type="number" inputmode="numeric" min="0" step="1000" placeholder="Giá cuối (VND)" value="'+esc(o.final_fare_vnd||"")+'" aria-label="Giá cuối VND">'+
      '<button type="button" class="btn" data-act="fare" data-id="'+id+'">Lưu giá</button>'+
    '</div>'+
    (activeDrivers().length===0?'<p class="fee-note">Chưa có tài xế đang hoạt động.</p>':'')+
  '</div>';
}

function orderHTML(o){
  var st=STATUS[o.status]||STATUS.pending;
  var key=STATUS[o.status]?o.status:"pending";
  var id=esc(o.id);
  var waiting=key==="pending"?' · chờ '+esc(ago(o.created_at).replace(" trước","")):"";
  var btns=(NEXT[key]||[]).map(function(n){
    var cls=n==="cancelled"?"btn btn-danger":(n==="pending"?"btn":"btn btn-primary");
    return '<button type="button" class="'+cls+'" data-act="status" data-id="'+id+'" data-to="'+n+'">'+ACTION[n]+"</button>";
  }).join("");
  var pickupLinks=hasGps(o)
    ?'<div class="gps-coords">GPS: '+esc(o.pickup_latitude)+', '+esc(o.pickup_longitude)+'</div><div class="maplinks"><a href="'+esc(pickupMapHref(o))+'" target="_blank" rel="noopener">Xem vị trí</a><a href="'+esc(dirHref(o))+'" target="_blank" rel="noopener">Dẫn đường</a></div>'
    :'<div class="maplinks"><a href="'+esc(mapHref(o.pickup_address))+'" target="_blank" rel="noopener">Bản đồ</a></div>';
  return '<article class="order '+st.cls+'">'+
    '<div class="order-top"><strong>Đơn #'+id+'</strong><span class="badge">'+esc(st.label)+'</span></div>'+
    '<div class="time">'+esc(fmtDate(o.created_at))+" · "+esc(ago(o.created_at))+waiting+'</div>'+
    '<div class="info">'+
      '<div><small>Dịch vụ</small>'+esc(o.service_type)+'</div>'+
      '<div><small>Số điện thoại</small><a href="'+esc(phoneHref(o.customer_phone))+'">'+esc(o.customer_phone)+'</a></div>'+
      '<div><small>Điểm nhận</small>'+esc(o.pickup_address)+pickupLinks+'</div>'+
      '<div><small>Điểm đến</small>'+esc(o.dropoff_address)+' <a href="'+esc(mapHref(o.dropoff_address))+'" target="_blank" rel="noopener">Bản đồ</a></div>'+
      '<div class="full"><small>Ghi chú</small>'+esc(o.note||"-")+'</div>'+
    '</div>'+
    driverHTML(o)+
    '<div class="actions">'+btns+'<button type="button" class="btn" data-act="copy" data-id="'+id+'">Sao chép đơn</button></div>'+
  '</article>';
}

/* 渲染：保留管理员已选但还没提交的下拉/价格，避免自动刷新时被清空 */
function render(){
  var keep={};
  document.querySelectorAll("#ordersList [data-dirty]").forEach(function(el){keep[el.id]=el.value;});
  var active=document.activeElement&&document.activeElement.id;
  updateStats();renderChips();
  var list=getFiltered(),shown=list.slice(0,visibleLimit);
  $("ordersList").innerHTML=shown.length?shown.map(orderHTML).join(""):'<p class="muted">Không tìm thấy đơn hàng.</p>';
  Object.keys(keep).forEach(function(k){var el=$(k);if(el){el.value=keep[k];el.setAttribute("data-dirty","1");}});
  if(active&&$(active)&&/^(driver|fare)-/.test(active))$(active).focus();
  var more=$("moreButton");
  if(list.length>shown.length){more.textContent="Xem thêm ("+(list.length-shown.length)+" đơn)";more.classList.remove("hidden");}
  else more.classList.add("hidden");
}
$("ordersList").addEventListener("input",function(e){if(/^(driver|fare)-/.test(e.target.id))e.target.setAttribute("data-dirty","1");});
$("ordersList").addEventListener("change",function(e){if(/^(driver|fare)-/.test(e.target.id))e.target.setAttribute("data-dirty","1");});

function findOrder(id){return allOrders.find(function(o){return String(o.id)===String(id);});}

/* 分配 / 更换司机：只有“待处理”的单才会自动变成“已分配”，进行中的单换司机不会被退回状态 */
async function assignDriver(id){
  var order=findOrder(id),select=$("driver-"+id);
  if(!order||!select)return;
  if(order.status==="completed"||order.status==="cancelled"){toast("Không thể phân tài xế cho đơn này.","bad");return;}
  if(!select.value){toast("Vui lòng chọn tài xế.","bad");return;}
  var driver=getDriver(select.value);
  if(!driver||!driver.is_active){toast("Tài xế không hợp lệ hoặc không hoạt động.","bad");return;}
  if(String(order.assigned_driver_id)===String(driver.user_id)){toast("Đơn đã được phân cho tài xế này.","bad");return;}
  if(!confirm((order.assigned_driver_id?"Đổi tài xế đơn #":"Phân đơn #")+id+" cho "+driver.full_name+"?"))return;
  var patch={assigned_driver_id:driver.user_id};
  if(order.status==="pending")patch.status="assigned";
  var r=await db.from("orders").update(patch).eq("id",order.id).select("*");
  if(r.error||!r.data||!r.data.length){toast("Phân tài xế thất bại: "+(r.error?r.error.message:"Không có quyền cập nhật đơn."),"bad");return;}
  Object.assign(order,r.data[0]);
  select.removeAttribute("data-dirty");
  render();toast("Đã phân công tài xế: "+driver.full_name,"ok");
}

/* 保存最终价格（完成订单前必须有价格） */
async function saveFare(id){
  var order=findOrder(id),input=$("fare-"+id);
  if(!order||!input)return;
  var v=Math.round(Number(input.value));
  if(!Number.isFinite(v)||v<=0){toast("Giá phải lớn hơn 0.","bad");return;}
  var r=await db.from("orders").update({final_fare_vnd:v}).eq("id",order.id).select("*");
  if(r.error||!r.data||!r.data.length){toast("Lưu giá thất bại: "+(r.error?r.error.message:"Không có quyền cập nhật đơn."),"bad");return;}
  Object.assign(order,r.data[0]);
  input.removeAttribute("data-dirty");
  render();toast("Đã lưu giá: "+fmtVnd(v),"ok");
}

/* 修改订单状态 */
async function changeStatus(id,to){
  var order=findOrder(id);
  if(!order||order.status===to)return;
  if(to==="in_progress"&&!order.assigned_driver_id){toast("Phải phân tài xế trước khi bắt đầu vận chuyển.","bad");return;}
  if(to==="completed"){
    if(!order.assigned_driver_id){toast("Phải phân tài xế trước khi hoàn thành đơn.","bad");return;}
    if(!order.final_fare_vnd||Number(order.final_fare_vnd)<=0){toast("Hãy nhập và lưu giá cuối trước khi hoàn thành.","bad");return;}
    if(!confirm("Xác nhận hoàn thành đơn #"+order.id+"?\n\nHệ thống sẽ tạo bản ghi phí tài xế 8% và phí nền tảng khách hàng 2.000 VND."))return;
  }
  if(to==="cancelled"&&!confirm("Hủy đơn #"+order.id+"?"))return;
  var r=await db.from("orders").update({status:to}).eq("id",order.id).select("*");
  if(r.error||!r.data||!r.data.length){
    toast("Cập nhật thất bại: "+(r.error?r.error.message:"Không có quyền cập nhật đơn."),"bad");
    await loadOrders(true);return;
  }
  Object.assign(order,r.data[0]);render();
  toast(to==="completed"?"Đơn hoàn thành. Đã gửi yêu cầu ghi nhận phí.":"Đã chuyển sang: "+STATUS[to].label,"ok");
}

/* 复制订单 */
async function copyOrder(id){
  var o=findOrder(id);if(!o)return;
  var gps=hasGps(o);
  var mapLink=gps?"https://www.google.com/maps?q="+o.pickup_latitude+","+o.pickup_longitude:mapHref(o.pickup_address);
  var d=getDriver(o.assigned_driver_id);
  var text=["MOVA - Đơn #"+o.id,"Dịch vụ: "+o.service_type,"SĐT: "+o.customer_phone,
    "Tài xế: "+(d?d.full_name:"Chưa phân công"),"Điểm nhận: "+o.pickup_address,
    (gps?"Vị trí GPS: ":"Bản đồ: ")+mapLink,"Điểm đến: "+o.dropoff_address,"Ghi chú: "+(o.note||"-")].join("\n");
  try{await navigator.clipboard.writeText(text);toast("Đã sao chép đơn hàng.","ok");}
  catch(e){toast("Không sao chép được. Hãy thử lại.","bad");}
}

/* CSV 导出（防公式注入） */
function csvCell(v){
  var s=String(v==null?"":v);
  if(/^[=+\-@\t\r]/.test(s))s="'"+s;
  return '"'+s.replace(/"/g,'""')+'"';
}
function exportCSV(){
  var rows=getFiltered();
  if(!rows.length){toast("Không có đơn để xuất.","bad");return;}
  var lines=[["ID","Thời gian","Dịch vụ","Số điện thoại","Tài xế","Điểm nhận","Vĩ độ","Kinh độ","Điểm đến","Ghi chú","Giá cuối (VND)","Trạng thái"].map(csvCell).join(",")];
  rows.forEach(function(o){
    var d=getDriver(o.assigned_driver_id);
    lines.push([o.id,fmtDate(o.created_at),o.service_type,o.customer_phone,d?d.full_name:"",o.pickup_address,o.pickup_latitude,o.pickup_longitude,o.dropoff_address,o.note,o.final_fare_vnd,(STATUS[o.status]||{}).label||o.status].map(csvCell).join(","));
  });
  var blob=new Blob(["\ufeff"+lines.join("\r\n")],{type:"text/csv;charset=utf-8"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="mova-orders-"+new Date().toISOString().slice(0,10)+".csv";
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(a.href);},1000);
}

/* 事件 */
$("ordersList").addEventListener("click",function(e){
  var b=e.target.closest("[data-act]");if(!b)return;
  var act=b.dataset.act,id=b.dataset.id;
  b.disabled=true;
  var done=function(){if(b.isConnected)b.disabled=false;};
  if(act==="status")once("s"+id,function(){return changeStatus(id,b.dataset.to);}).then(done,done);
  else if(act==="assign")once("s"+id,function(){return assignDriver(id);}).then(done,done);
  else if(act==="fare")once("s"+id,function(){return saveFare(id);}).then(done,done);
  else if(act==="copy")copyOrder(id).then(done,done);
});
$("chips").addEventListener("click",function(e){
  var c=e.target.closest("[data-filter]");if(!c)return;
  filterStatus=c.dataset.filter;visibleLimit=PAGE_SIZE;render();
});
$("searchInput").addEventListener("input",function(){
  clearTimeout(searchTimer);
  searchTimer=setTimeout(function(){visibleLimit=PAGE_SIZE;render();},200);
});
$("moreButton").addEventListener("click",function(){visibleLimit+=PAGE_SIZE;render();});
$("refreshButton").addEventListener("click",async function(){
  var b=$("refreshButton");b.disabled=true;
  await loadDrivers();await loadOrders();
  b.disabled=false;toast("Đã làm mới.","ok");
});
$("exportButton").addEventListener("click",exportCSV);

/* 启动 */
(async function init(){
  var r=await db.auth.getSession();
  if(r.error||!r.data.session)return;
  try{await openDashboard(r.data.session.user);}
  catch(err){await db.auth.signOut();showLogin(err.message,"error");}
})();
</script>
